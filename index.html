<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제조일정 캘린더 → 작성상황 자동화</title>
</head>
<body>
<div id="app"></div>
<style>
  :root{
    --navy:#16324f; --navy-2:#1f3f61; --paper:#f7f8fa; --card:#ffffff;
    --ink:#1b2530; --sub:#5b6b7c; --line:#dbe2ea;
    --teal:#0e8a7a; --teal-d:#0b6e61;
    --amber:#f4b942; --amber-bg:#fff6df;
    --red:#c0392b; --red-bg:#fbe9e7;
    --pink:#e0468a; --pink-bg:#ffe3f2;
    --blue:#1f5fbf;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  #app{font-family:var(--sans); color:var(--ink); background:var(--paper); padding:18px; line-height:1.4; font-size:13px;}
  h1{font-size:18px; margin:0 0 2px; color:var(--navy);}
  h2{font-size:13px; margin:0 0 10px; color:var(--navy-2); display:flex; align-items:center; gap:6px;}
  .sub{color:var(--sub); font-size:12px; margin-bottom:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .cols2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:900px){ .cols2{grid-template-columns:1fr;} }
  .cols3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:1150px){ .cols3{grid-template-columns:1fr;} }
  label{font-size:12px; color:var(--sub);}
  select, input[type=text], input[type=date], textarea, input[type=number]{
    font-family:var(--sans); font-size:12px; border:1px solid var(--line); border-radius:6px; padding:5px 7px; background:#fff; color:var(--ink);
  }
  textarea{width:100%; min-height:56px; resize:vertical;}
  button{font-family:var(--sans); font-size:12px; border:none; border-radius:6px; padding:6px 12px; background:var(--teal); color:#fff; cursor:pointer; font-weight:600;}
  button:hover{background:var(--teal-d);}
  button.ghost{background:#fff; color:var(--navy-2); border:1px solid var(--line);}
  button.ghost:hover{background:#eef2f6;}
  button.danger{background:#fff; color:var(--red); border:1px solid var(--red-bg); padding:3px 8px; font-size:11px;}
  .status{font-size:11px; color:var(--sub);}
  .pastezone{
    border:2px dashed #b9c6d4; border-radius:10px; background:#fbfcfe; min-height:110px;
    padding:14px; font-size:12px; color:var(--sub); outline:none; font-family:var(--mono);
  }
  .pastezone:focus{border-color:var(--teal); background:#fff;}
  .pastezone.filled{border-style:solid; border-color:var(--teal); color:var(--ink); background:#fff;}
  .hint{font-size:11px; color:var(--sub); margin-top:6px;}
  .warnbox{background:var(--amber-bg); border:1px solid #f0d38a; border-radius:8px; padding:8px 10px; font-size:11.5px; color:#7a5a0a; margin-top:8px;}
  .errbox{background:var(--red-bg); border:1px solid #e7b3ac; border-radius:8px; padding:8px 10px; font-size:11.5px; color:#8a3527; margin-top:8px;}

  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal .dow{text-align:center; font-size:11px; font-weight:700; color:var(--sub); padding-bottom:2px;}
  .cal .day{background:#fbfcfe; border:1px solid var(--line); border-radius:8px; min-height:120px; padding:5px 6px; font-size:11px;}
  .cal .day.empty{background:transparent; border:none;}
  .cal .day.weekend{background:#fdf5f4;}
  .cal .halves{display:grid; grid-template-columns:1fr 1fr; gap:5px;}
  .cal .halfcol{border-left:1px dashed var(--line); padding-left:4px;}
  .cal .halfcol:first-child{border-left:none; padding-left:0;}
  .cal .halflabel{font-size:9px; color:var(--sub); font-weight:700; margin-bottom:2px;}
  .cal .day.holiday-cell{background:var(--red); color:#fff; font-weight:700;}
  .cal .day:not(.empty):hover{outline:2px solid var(--teal);}
  .cal .daynum{font-weight:700; color:var(--navy-2); margin-bottom:3px; display:flex; justify-content:space-between;}
  .cal .chip{display:block; background:#eef2f6; border-radius:5px; padding:1px 5px; margin-bottom:2px; font-family:var(--mono); font-size:10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cal .chip.start{background:var(--navy); color:#fff; font-weight:700;}
  .cal .chip.ipc{outline:2px solid var(--pink);}
  .cal .chip.pv{border-left:3px solid var(--blue);}
  .cal .chip:hover{filter:brightness(0.95);}

  .grid-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; max-height:640px; overflow-y:auto;}
  table.sched{border-collapse:collapse; width:max-content; min-width:100%;}
  table.sched th, table.sched td{border:1px solid var(--line); padding:3px 5px; text-align:center; font-size:11px;}
  table.sched thead th{background:var(--navy); color:#fff; font-weight:600; position:sticky; top:0; z-index:3;}
  table.sched thead tr.wk th{background:var(--navy-2); top:0;}
  table.sched thead tr:last-child th{top:23px;}
  th.dayhead{min-width:150px;}
  th.corner{position:sticky; left:0; z-index:4; background:var(--navy); min-width:110px;}
  td.rowname{position:sticky; left:0; background:#eef2f6; z-index:2; min-width:110px; font-weight:700; font-family:var(--mono);}
  table.sched td.cell{min-width:75px; font-family:var(--mono); color:var(--navy-2);}
  table.sched td.cell.weekend{background:#fdf5f4;}
  table.sched td.cell.bold{background:var(--navy); color:#fff; font-weight:800;}
  table.sched td.cell.ipc{outline:2px solid var(--pink); outline-offset:-2px;}
  table.tbl{border-collapse:collapse; width:100%; font-size:11.5px;}
  table.tbl th, table.tbl td{border:1px solid var(--line); padding:4px 5px; text-align:center;}
  table.tbl thead th{background:var(--navy-2); color:#fff; position:sticky; top:0;}
  table.tbl td input, table.tbl td select{width:100%; border:1px solid transparent; background:transparent; text-align:center; font-family:var(--mono);}
  table.tbl td input:focus, table.tbl td select:focus{border:1px solid var(--teal); background:#fff;}
  table.tbl tr.hl{outline:2px solid var(--teal);}
  table.tbl tr.flag td{background:var(--amber-bg);}
  table.tbl td.rownum{background:#eef2f6; color:var(--sub); font-weight:700; cursor:pointer; user-select:none; width:36px;}
  button.daybtn{padding:2px 5px; font-size:10px; background:#eef2f6; color:var(--navy-2); border:1px solid var(--line);}
  button.daybtn:hover{background:#dde6ee;}
  table.tbl td.rownum:hover{background:#dde6ee;}
  table.tbl tr.selected-row td{background:#dff3ef !important;}
  table.tbl tr.selected-row td.rownum{background:var(--teal) !important; color:#fff;}
  .roster-badge{display:inline-block; background:#eef2f6; border-radius:5px; padding:2px 6px; margin:2px; font-size:11px;}
  .toolbar{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://lyhpdieccxflvqdepkni.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_JD4r_Q7c7Rfk7MJ3BZ8i2w_BoWmgjtt";
  const KV_TABLE = "kv_store";

  async function kvGet(key){
    try{
      const url = `${SUPABASE_URL}/rest/v1/${KV_TABLE}?key=eq.${encodeURIComponent(key)}&select=value`;
      const res = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY } });
      if(!res.ok) return null;
      const rows = await res.json();
      return (rows && rows.length) ? { value: rows[0].value } : null;
    }catch(e){ console.error("kvGet 실패", key, e); return null; }
  }

  async function kvSet(key, value){
    try{
      const url = `${SUPABASE_URL}/rest/v1/${KV_TABLE}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify([{ key, value }])
      });
      if(!res.ok) console.error("kvSet 실패", key, await res.text());
      return res.ok;
    }catch(e){ console.error("kvSet 실패", key, e); return false; }
  }

  let holidayList = "";
  function holidaySet(){ return new Set(parseList(holidayList)); }
  function isWeekend(d){ const w=d.getDay(); return w===0||w===6; }
  function isHoliday(d){ return holidaySet().has(iso(d)); }
  function isNonBiz(d){ return isWeekend(d) || isHoliday(d); }
  function nextBD(d){ const n=new Date(d); do{ n.setDate(n.getDate()+1); }while(isNonBiz(n)); return n; }
  function addBD(d,n){ let c=new Date(d); for(let i=0;i<n;i++) c=nextBD(c); return c; }
  function generalBprDate(end){ return isNonBiz(end)? nextBD(end) : end; }
  function specialBprDate(end){ return addBD(end, isNonBiz(end)?2:1); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fromIso(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
  function wkKr(d){ return ['일','월','화','수','목','금','토'][d.getDay()]; }
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
  function monthLetter(m){ return String.fromCharCode(64+m); } // 1월=A, 7월=G, 12월=L

  function parseCode(raw){
    if(!raw) return null;
    let text = String(raw).trim();
    let team = "";
    const tm = text.match(/\(([^)]*)\)\s*$/);
    if(tm){ team = tm[1]; text = text.slice(0, tm.index).trim(); }
    text = text.replace(/\s+/g,'');
    if(text.length < 7) return null;
    const tail = text.slice(-7);
    const namePart = text.slice(0, -7);
    const tailM = tail.match(/^(\d)(\d{2})([A-Za-z])(\d{2})(\d)$/);
    if(!tailM || !/^[A-Za-z]+\d{0,2}$/.test(namePart)) return null;
    const [, method, year, monthCode, seq, reprocess] = tailM;
    const sm = namePart.match(/^([A-Za-z]+)(\d{2})$/);
    let base, suffix;
    if(sm){ base = sm[1]; suffix = sm[2]; } else { base = namePart; suffix = ""; }
    return { base, suffix, method, year, monthCode, seq: seq+reprocess, team, codeId: base+suffix };
  }
  function expandRangeCode(raw){
    if(!raw) return null;
    let text = String(raw).trim();
    let team = "";
    const tm = text.match(/\(([^)]*)\)\s*$/);
    if(tm){ team = tm[1]; text = text.slice(0, tm.index).trim(); }
    text = text.replace(/\s+/g,'');
    const tildeIdx = text.indexOf('~');
    if(tildeIdx < 0) return null;
    const left = text.slice(0, tildeIdx);
    const right = text.slice(tildeIdx+1);
    const leftParsed = parseCode(left);
    if(!leftParsed) return null;
    const rm = right.match(/^([A-Za-z])?(\d{3})$/);
    if(!rm) return null;
    const startNum = parseInt(leftParsed.seq, 10);
    const endNum = parseInt(rm[2], 10);
    if(isNaN(startNum) || isNaN(endNum) || endNum <= startNum) return null;
    const step = 10;
    const codes = [];
    for(let n = startNum; n <= endNum; n += step){
      const seqStr = String(n).padStart(3, '0');
      codes.push({ base: leftParsed.base, suffix: leftParsed.suffix, method: leftParsed.method,
        year: leftParsed.year, monthCode: leftParsed.monthCode, seq: seqStr, team, codeId: leftParsed.codeId });
    }
    return codes.length ? codes : null;
  }
  function parseList(str){ return (str||"").split(/[,\s]+/).map(s=>s.trim().replace(/\([^)]*\)\s*$/,'')).filter(Boolean); }
  function uid(p){ return p+Math.random().toString(36).slice(2,9); }

  function colorIsBlueish(rgb){
    if(!rgb) return false;
    const m = rgb.match(/(\d+),\s*(\d+),\s*(\d+)/); if(!m) return false;
    const [r,g,b] = m.slice(1).map(Number);
    return b>120 && b > r+25 && b > g+10;
  }
  function colorIsPinkish(rgb){
    if(!rgb) return false;
    const m = rgb.match(/(\d+),\s*(\d+),\s*(\d+)/); if(!m) return false;
    const [r,g,b] = m.slice(1).map(Number);
    return r>220 && b>190 && g<210 && (r-g)>20;
  }
  function scanStyle(node, acc){
    if(node.style){
      const fw = node.style.fontWeight;
      if(fw && (fw==='bold' || parseInt(fw,10)>=600)) acc.bold = true;
      if(node.style.color && colorIsBlueish(node.style.color)) acc.blue = true;
      const bg = node.style.backgroundColor;
      if(bg && colorIsPinkish(bg)) acc.pink = true;
    }
    if(node.tagName==='B' || node.tagName==='STRONG') acc.bold = true;
    Array.from(node.children||[]).forEach(ch=>scanStyle(ch, acc));
  }
  function extractCellInfo(cell){
    const acc = {bold:false, blue:false, pink:false};
    scanStyle(cell, acc);
    return { text: (cell.textContent||"").trim(), bold: acc.bold, blue: acc.blue, pink: acc.pink };
  }
  function tableToGrid(table){
    const grid = [];
    const pending = {};
    const rows = table.rows;
    for(let r=0; r<rows.length; r++){
      grid[r] = [];
      let col = 0, ci = 0;
      const cells = rows[r].cells;
      while(ci < cells.length || pending[col]){
        if(pending[col] && pending[col].rowsLeft > 0){
          grid[r][col] = pending[col].value;
          pending[col].rowsLeft--;
          if(pending[col].rowsLeft===0) delete pending[col];
          col++; continue;
        }
        const cell = cells[ci++];
        if(!cell){ col++; continue; }
        const colspan = cell.colSpan||1, rowspan = cell.rowSpan||1;
        const value = extractCellInfo(cell);
        for(let k=0;k<colspan;k++){
          grid[r][col+k] = value;
          if(rowspan>1) pending[col+k] = {rowsLeft: rowspan-1, value};
        }
        col += colspan;
      }
    }
    return grid;
  }
  function htmlToGrid(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const table = doc.querySelector('table');
    if(!table) return null;
    return tableToGrid(table);
  }
  function textToGrid(text){
    return text.split(/\r?\n/).filter(l=>l.length).map(line=> line.split('\t').map(t=>({text:t.trim(), bold:false, blue:false, pink:false})));
  }

  const BLOCK_MARKERS = ["원료 칭량","원료칭량","pH 측정","QC IPC","특이사항"];
  const QC_INTER_MARK = "QC 중간체";
  const QC_API_MARK = "QC 원료의약품";

  function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }

  function findFirstDateCol(rowArr, after){
    for(let c=after+1; c<rowArr.length; c++){ const n=parseInt((rowArr[c]&&rowArr[c].text||"").trim(),10); if(n>=1&&n<=31) return c; }
    return after+1;
  }

  function dedupeBatches(batches){
    const map = {};
    const order = [];
    batches.forEach(b=>{
      const key = `${b.codeId}_${b.monthCode}_${b.seq}`;
      if(!map[key]){ map[key] = Object.assign({}, b); order.push(key); }
      else {
        const existing = map[key];
        if(b.start < existing.start){ existing.start = b.start; existing.startHalf = b.startHalf; existing.startBold = b.startBold; existing.possibleContinuation = b.possibleContinuation; }
        if(b.end > existing.end){ existing.end = b.end; existing.endHalf = b.endHalf; }
        existing.ipcDates = Array.from(new Set([...(existing.ipcDates||[]), ...(b.ipcDates||[])]));
        if(!existing.team && b.team) existing.team = b.team;
      }
    });
    return order.map(k=>map[k]);
  }

  function mergeContinuations(batches){
    let changed = true;
    while(changed){
      changed = false;
      for(const b of batches){
        if(!b.possibleContinuation || b._removed) continue;
        const prevDay = iso(addDays(fromIso(b.start), -1));
        const match = batches.find(a=> !a._removed && a!==b
          && a.codeId===b.codeId && a.monthCode===b.monthCode && a.seq===b.seq && a.end===prevDay);
        if(match){
          match.end = b.end;
          match.endHalf = b.endHalf;
          match.ipcDates = (match.ipcDates||[]).concat(b.ipcDates||[]);
          b._removed = true;
          changed = true;
        }
      }
    }
    return batches.filter(b=>!b._removed);
  }

  function parseScheduleGrid(grid, year, month, hadFormatting){
    const warnings = [];
    const headerRows = [];
    for(let r=0; r<grid.length; r++){
      for(let c=0; c<(grid[r]||[]).length; c++){
        const t = (grid[r][c]||{}).text||"";
        if(t.replace(/\s+/g,'')==='품명'){ headerRows.push({row:r, col:c}); break; }
      }
    }
    if(headerRows.length===0){
      warnings.push("'품명' 헤더를 찾지 못했습니다. 붙여넣은 범위에 헤더 행(구분/품명/문서번호/제조단위)이 포함되어 있는지 확인해주세요.");
      return {batches:[], qcInter:{}, qcApi:{}, warnings};
    }

    let allBatches = [];
    const qcInter = {}, qcApi = {};

    headerRows.forEach((hdr, blockIdx)=>{
      const headerRow = hdr.row, nameCol = hdr.col;
      const blockEndRow = (blockIdx+1 < headerRows.length) ? headerRows[blockIdx+1].row : grid.length;

      let dateRow = -1;
      for(let r=Math.max(0,headerRow-3); r<headerRow; r++){
        let cnt=0;
        (grid[r]||[]).forEach(cell=>{ const n=parseInt((cell&&cell.text||"").trim(),10); if(n>=1 && n<=31) cnt++; });
        if(cnt>=3) dateRow = r;
      }
      if(dateRow<0){ warnings.push(`${blockIdx+1}번째 주간 표에서 날짜 행을 찾지 못해 건너뜁니다.`); return; }

      const dataStartCol = findFirstDateCol(grid[dateRow], nameCol);
      const colDay = {};
      for(let c=dataStartCol; c<grid[dateRow].length; c++){
        const n = parseInt((grid[dateRow][c]&&grid[dateRow][c].text||"").trim(),10);
        if(n>=1 && n<=31) colDay[c] = n;
      }
      let last=null;
      for(let c=dataStartCol; c<grid[dateRow].length; c++){
        if(colDay[c]!=null) last=colDay[c]; else if(last!=null) colDay[c]=last;
      }
      const dayValues = Object.values(colDay);
      if(dayValues.length===0){ warnings.push(`${blockIdx+1}번째 주간 표에서 날짜를 인식하지 못했습니다.`); return; }
      const blockMinDay = colDay[dataStartCol];

      const colDateIso = {};
      { let monthOffset = 0, prevDay = null;
        const firstDayInBlock = colDay[dataStartCol];
        if(firstDayInBlock!=null && firstDayInBlock > daysInMonth(year, month)) monthOffset = -1;
        for(let c=dataStartCol; c<grid[dateRow].length; c++){
          if(colDay[c]==null) continue;
          if(prevDay!=null && colDay[c] < prevDay) monthOffset++;
          prevDay = colDay[c];
          colDateIso[c] = iso(new Date(year, month-1+monthOffset, colDay[c]));
        }
      }

      let mode = 'data';
      for(let r=headerRow+1; r<blockEndRow; r++){
        const label = ((grid[r]||[])[nameCol]||{}).text || "";
        if(!label) continue;
        if(BLOCK_MARKERS.some(m=>label.includes(m)) && !label.includes(QC_INTER_MARK) && !label.includes(QC_API_MARK)){
          mode = 'qc-scan';
        }
        if(label.includes(QC_INTER_MARK) || label.includes(QC_API_MARK)){
          const target = label.includes(QC_INTER_MARK) ? qcInter : qcApi;
          for(let c=dataStartCol; c<grid[r].length; c++){
            const dISO = colDateIso[c]; const v = (grid[r][c]||{}).text||"";
            if(!dISO || !v.trim()) continue;
            parseList(v).forEach(name=>{ target[dISO] = target[dISO]||[]; if(!target[dISO].includes(name)) target[dISO].push(name); });
          }
          continue;
        }
        if(mode!=='data') continue;

        const isPvRow = (grid[r][nameCol]||{}).blue || false;
        let cur = null;
        for(let c=dataStartCol; c<grid[r].length; c++){
          const day = colDay[c]; if(!day) continue;
          const cellInfo = grid[r][c] || {};
          if(!cellInfo.text){ if(cur){ allBatches.push(cur); cur=null; } continue; }
          const half = ((c - dataStartCol) % 2 === 0) ? 'am' : 'pm';
          const rangeCodes = expandRangeCode(cellInfo.text);
          const codesInCell = rangeCodes || (parseCode(cellInfo.text) ? [parseCode(cellInfo.text)] : []);
          if(codesInCell.length===0) continue;
          const dISO = colDateIso[c];
          codesInCell.forEach(parsed=>{
            const sameLot = cur && cur.codeId===parsed.codeId && cur.monthCode===parsed.monthCode && cur.seq===parsed.seq;
            if(!sameLot){
              if(cur) allBatches.push(cur);
              cur = {
                id: uid('b'), codeId: parsed.codeId, base:parsed.base, suffix:parsed.suffix,
                method:parsed.method, year:parsed.year, monthCode:parsed.monthCode, seq:parsed.seq,
                team:parsed.team, start: dISO, end: dISO, startHalf: half, endHalf: half, ipcDates: [],
                pv: isPvRow, startBold: hadFormatting? !!cellInfo.bold : true, note:"",
                blockIdx, possibleContinuation: (day===blockMinDay && hadFormatting && !cellInfo.bold),
              };
            } else {
              cur.end = dISO;
              cur.endHalf = half;
              if(parsed.team) cur.team = parsed.team;
            }
            if(cellInfo.pink) cur.ipcDates.push(dISO);
          });
        }
        if(cur) allBatches.push(cur);
      }
    });

    allBatches = mergeContinuations(allBatches);
    allBatches = dedupeBatches(allBatches);

    allBatches.forEach(b=>{
      if(b.blockIdx===0 && b.possibleContinuation){
        b.note = (b.note? b.note+" / ":"") + "이번 붙여넣기 범위의 첫날에 굵은 표시가 없어 이전 달 이월 배치일 수 있습니다(맞으면 직접 삭제해주세요)";
      }
    });
    if(!hadFormatting) warnings.push("서식 정보 없이 텍스트만 붙여넣어져 굵은 글씨(제조시작일)를 자동으로 구분하지 못했습니다. 아래 표에서 시작일/완료일을 확인해주세요.");
    warnings.push(`총 ${headerRows.length}개 주간 표를 인식했습니다.`);
    return { batches: allBatches, qcInter, qcApi, warnings };
  }

  function parseRosterGrid(grid){
    const roster = [];
    grid.forEach(row=>{
      for(let c=0;c<row.length-1;c++){
        const noTxt = (row[c]&&row[c].text||"").replace(/\s+/g,'');
        if(/^\d+[&]?$/.test(noTxt) && noTxt!==""){
          const name1 = (row[c+1]&&row[c+1].text||"").trim();
          const name2raw = (row[c+2]&&row[c+2].text||"").trim();
          const name2 = (name2raw && !/^\d+[&]?$/.test(name2raw)) ? name2raw : "";
          if(name1 && !/^\d+$/.test(name1)) roster.push({no:noTxt, name1, name2});
        }
      }
    });
    return roster;
  }
  function findRoster(team){
    if(!team) return null;
    const tokens = team.split(',').map(s=>s.trim());
    return state.roster.find(x=> tokens.includes(x.no)) || null;
  }
  function resolveTeamNames(teamStr){
    if(!teamStr) return null;
    const tokens = teamStr.split(',').map(s=>s.trim()).filter(Boolean);
    if(tokens.length===0) return null;
    const parts = tokens.map(t=>{
      const hit = state.roster.find(x=>x.no===t);
      return hit ? [hit.name1, hit.name2].filter(Boolean).join('/') : null;
    });
    if(parts.some(p=>!p)) return null;
    return parts.join('&');
  }

  const FIELD_KEYWORDS = [
    ['제법+년도','methodYear'], ['제법','method'], ['년도','year'],
    ['해당월순번','seq'], ['순번','seq'], ['일련번호','seq'],
    ['해당월','monthCode'], ['월','monthCode'],
    ['제조시작일','start'], ['시작일','start'],
    ['제조완료일','end'], ['완료일','end'],
    ['품질시험','qcType'],
    ['PV','pv'], ['CV','cv'], ['실시간','realtime'],
    ['생산동','floor2'],
    ['BPR','bpr'], ['로그북','logbook'],
    ['작성자(1)','writer1'], ['확인자(1)','confirmer1'],
    ['작성자(2)','writer2'], ['확인자(2)','confirmer2'],
    ['작업조','team'],
    ['비고','note'],
    ['발행번호','issueNo'],
    ['품목명','item'], ['품명','item'],
    ['No','no'],
  ];
  function detectFieldType(headerText){
    const t = (headerText||"").replace(/\s+/g,'');
    for(const [kw,type] of FIELD_KEYWORDS){ if(t.includes(kw.replace(/\s+/g,''))) return type; }
    return null;
  }
  function parseLedgerGrid(grid){
    if(!grid || grid.length===0) return {header:[], rows:[]};
    let headerRowIdx = 0, bestScore = -1;
    for(let r=0; r<Math.min(grid.length,5); r++){
      const filled = (grid[r]||[]).filter(c=>c && c.text && c.text.trim()).length;
      if(filled>bestScore){ bestScore = filled; headerRowIdx = r; }
    }
    const headerRow = grid[headerRowIdx]||[];
    const header = headerRow.map(c=> ({ text: (c&&c.text||"").trim(), field: detectFieldType(c&&c.text) }));
    const rows = grid.slice(headerRowIdx+1)
      .filter(row=> row.some(c=>c && c.text && c.text.trim()))
      .map(row=> header.map((h,i)=> (row[i]&&row[i].text)||""));
    return { header, rows };
  }

  function categoryFor(codeId){
    const hit = qcCategoryRows.find(r=> parseList(r.details).includes(codeId));
    return hit ? hit.category.trim() : null;
  }
  function findQcDate(codeId, refDate){
    const category = categoryFor(codeId);
    const matchNames = category ? [category, codeId] : [codeId];
    let best = null, bestDiff = Infinity;
    qcInterRows.forEach(row=>{
      if(!row.date) return;
      const items = parseList(row.items);
      if(!matchNames.some(n=> items.includes(n))) return;
      const d = fromIso(row.date);
      const diff = Math.abs(d - refDate);
      if(diff < bestDiff){ bestDiff = diff; best = d; }
    });
    return best;
  }

  function bizDaysInRange(start, end){
    let count = 0, d = new Date(start);
    while(d <= end){ if(!isNonBiz(d)) count++; d = addDays(d, 1); }
    return count;
  }
  function nthBizDayFrom(d, n){
    let c = new Date(d);
    let count = isNonBiz(c) ? 0 : 1;
    while(count < n){ c = nextBD(c); count++; }
    return c;
  }

  function computeRules(){
    return state.batches.map(b=>{
      const start = fromIso(b.start), effEnd = fromIso(b.end);
      let note = [];

      const isMid = !!b.suffix;
      const isSpecial = !!(b.pv || b.realtime);
      const ipcOnLastDay = (b.ipcDates||[]).includes(iso(effEnd));

      let qcType = "X", qcDate = null;
      if(b.noQc){
        qcType = "X";
      } else if(isMid){
        qcDate = findQcDate(b.codeId, effEnd);
        if(qcDate){ qcType="O"; } else { qcType="?"; note.push("QC 중간체 시험의뢰일 확인 필요"); }
      }

      let bpr;
      const weekendExtra = isNonBiz(effEnd) ? 2 : 1;
      if(isMid && qcType==="O"){
        const qcBased = addBD(qcDate, 1);
        if(isSpecial){
          const specialDate = addBD(effEnd, weekendExtra);
          bpr = specialDate > qcBased ? specialDate : qcBased;
        } else {
          bpr = qcBased;
        }
      } else if(isSpecial){
        let extra = weekendExtra;
        if(ipcOnLastDay) extra = Math.max(extra, 2);
        bpr = addBD(effEnd, extra);
      } else if(isMid && qcType==="?"){
        bpr = null;
      } else {
        bpr = generalBprDate(effEnd);
        if(ipcOnLastDay) bpr = addBD(bpr, 1);
      }

      const isEDM = (b.base||b.codeId||'').toUpperCase()==='EDM';
      if(isMid && !isEDM && bizDaysInRange(start, effEnd)<=1){
        const floorDate = nthBizDayFrom(start, 2);
        if(!bpr || floorDate > bpr){ bpr = floorDate; note.push("근무일 1일 최소보장으로 제출일 조정"); }
      }

      let logbook = effEnd;
      if(isNonBiz(logbook)) logbook = nextBD(logbook);
      let logExtra = 0;
      if(isSpecial) logExtra = 1;
      if(ipcOnLastDay) logExtra = Math.max(logExtra, 1);
      if(logExtra) logbook = addBD(logbook, logExtra);
      if(ipcOnLastDay) note.push("IPC가 완료일과 겹쳐 제출일 조정");
      if(isMid && !isEDM && bizDaysInRange(start, effEnd)<=1){
        const floorDate = nthBizDayFrom(start, 2);
        if(floorDate > logbook) logbook = floorDate;
      }

      if(b.startBold===false) note.push("시작일 굵게 표시 확인 필요(이월 배치일 수 있음)");

      const rosterHit = findRoster(b.team);
      const teamNamesCombined = resolveTeamNames(b.team);
      return Object.assign({}, b, {start, end: effEnd, qcType, bpr, logbook, note: note.join(" / "),
        rosterName: teamNamesCombined || (rosterHit? [rosterHit.name1, rosterHit.name2].filter(Boolean).join('/') : ""),
        rosterName1: rosterHit? rosterHit.name1 : "", rosterName2: rosterHit? rosterHit.name2 : "" });
    }).sort((a,b)=> a.start-b.start || a.codeId.localeCompare(b.codeId));
  }

    (children||[]).forEach(c=> e.appendChild(typeof c==='string'? document.createTextNode(c): c));
    return e;
  }

  function coversHalf(b, dISO, half){
    if(!(b.start<=dISO && dISO<=b.end)) return false;
    if(dISO===b.start && (b.startHalf||'am')==='pm' && half==='am') return false;
    if(dISO===b.end && (b.endHalf||'pm')==='am' && half==='pm') return false;
    return true;
  }

  function buildCalendarCard(){
    const card = el('div', {class:'card'});
    card.appendChild(el('h2', null, ["📅 "+state.year+"년 "+state.month+"월 월간일정"]));

    const N = daysInMonth(state.year, state.month);
    const allDays = Array.from({length:N}, (_,i)=> i+1);
    if(state.batches.length===0){
      card.appendChild(el('div',{class:'hint'},["아직 배치가 없습니다. 위 ①번에 월간일정을 붙여넣어 주세요."]));
      return card;
    }

    const weeks = [];
    let curWeek = [];
    allDays.forEach(d=>{
      const dow = new Date(state.year, state.month-1, d).getDay();
      if(dow===1 && curWeek.length){ weeks.push(curWeek); curWeek=[]; }
      curWeek.push(d);
    });
    if(curWeek.length) weeks.push(curWeek);

    weeks.forEach(weekDays=>{
      const weekStartISO = iso(new Date(state.year, state.month-1, weekDays[0]));
      const weekEndISO = iso(new Date(state.year, state.month-1, weekDays[weekDays.length-1]));
      const activeCodes = new Set();
      state.batches.forEach(b=>{ if(b.start<=weekEndISO && b.end>=weekStartISO) activeCodes.add(b.codeId); });
      const rowCodes = Array.from(activeCodes).sort();
      if(rowCodes.length===0) return;

      const wrap = el('div', {class:'grid-wrap', style:'margin-bottom:14px;'});
      const table = el('table', {class:'sched'});
      const dowRow = el('tr', {class:'wk'});
      dowRow.appendChild(el('th', {class:'corner'}, ["품목"]));
      weekDays.forEach(d=>{
        const dt = new Date(state.year, state.month-1, d);
        dowRow.appendChild(el('th', {colspan:'2', class:'dayhead'}, [`${d} (${wkKr(dt)})`]));
      });
      const halfRow = el('tr');
      halfRow.appendChild(el('th'));
      weekDays.forEach(()=>{ halfRow.appendChild(el('th', null, ["오전"])); halfRow.appendChild(el('th', null, ["오후"])); });
      table.appendChild(el('thead', null, [dowRow, halfRow]));

      const tbody = el('tbody');
      rowCodes.forEach(codeId=>{
        const tr = el('tr');
        tr.appendChild(el('td', {class:'rowname'}, [codeId]));
        weekDays.forEach(d=>{
          const dt = new Date(state.year, state.month-1, d);
          const dISO = iso(dt);
          ['am','pm'].forEach(half=>{
            const active = state.batches.filter(b=> b.codeId===codeId && coversHalf(b, dISO, half));
            const td = el('td', {class:'cell'+(isWeekend(dt)?' weekend':'')});
            if(active.length){
              active.sort((a,b)=>(a.seq||'').localeCompare(b.seq||''));
              const isStart = active.some(b=> b.start===dISO && b.startHalf===half);
              const isIpc = active.some(b=> (b.ipcDates||[]).includes(dISO));
              let label;
              if(active.length>1){
                const first=active[0], last=active[active.length-1];
                label = `${first.codeId}${first.method}${first.year}${first.monthCode}${first.seq}~${last.monthCode}${last.seq}`;
              } else {
                const b=active[0];
                label = `${b.codeId}${b.method}${b.year}${b.monthCode}${b.seq}`;
              }
              const names = resolveTeamNames(active[0].team);
              const teamTxt = names ? `(${names})` : (active[0].team? `(${active[0].team})`:'');
              if(isStart) td.classList.add('bold');
              if(isIpc) td.classList.add('ipc');
              const span = el('div', {title: label+teamTxt, style:'cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;'}, [label+teamTxt]);
              span.onclick = ()=> highlightBatchRow(active[0].id);
              td.appendChild(span);
            }
            tr.appendChild(td);
          });
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      card.appendChild(wrap);
    });

    card.appendChild(el('div', {class:'legend', style:'margin-top:8px; display:flex; gap:14px; font-size:11px; color:var(--sub);'}, [
      el('span',null,["■ 진한 배경 = 제조시작일"]), el('span',null,["■ 분홍 테두리 = IPC"]),
    ]));
    return card;
  }

    const card = el('div', {class:'card'});
    card.appendChild(el('h2', null, ["📝 특이사항"]));
    const ta = el('textarea',{placeholder:'예: 7/17 정전 예정으로 EDM 오후 작업 취소 등'}); ta.value=state.notes;
    ta.oninput=()=>{state.notes=ta.value; scheduleSave();};
    card.appendChild(ta);
    return card;
  }

  function matchKey(b){ return `${b.codeId}_${b.monthCode||''}${b.seq||''}`; }
  function snapKey(){ return `snapshot:${state.year}-${String(state.month).padStart(2,'0')}`; }
  async function loadSnapshot(){
    try{ const r = await kvGet(snapKey()); return r && r.value ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  async function saveSnapshot(rows){
    const snap = {};
    rows.forEach(b=>{ snap[matchKey(b)] = { start: iso(b.start), end: iso(b.end), bpr: b.bpr? iso(b.bpr): null, logbook: iso(b.logbook), team: b.team||"" }; });
    try{ await kvSet(snapKey(), JSON.stringify(snap)); }catch(e){}
  }
  function diffAgainst(rows, prevSnap){
    const diffs = {};
    rows.forEach(b=>{
      const key = matchKey(b);
      const prev = prevSnap ? prevSnap[key] : null;
      if(!prev){ diffs[key] = "🆕 신규 배치"; return; }
      const changes = [];
      const curBpr = b.bpr? iso(b.bpr) : null;
      if(prev.start !== iso(b.start)) changes.push(`시작일 ${prev.start}→${iso(b.start)}`);
      if(prev.end !== iso(b.end)) changes.push(`완료일 ${prev.end}→${iso(b.end)}`);
      if((prev.bpr||'확인필요') !== (curBpr||'확인필요')) changes.push(`BPR ${prev.bpr||'확인필요'}→${curBpr||'확인필요'}`);
      if(prev.logbook !== iso(b.logbook)) changes.push(`로그북 ${prev.logbook}→${iso(b.logbook)}`);
      if((prev.team||"") !== (b.team||"")) changes.push(`작업조 ${prev.team||'-'}→${b.team||'-'}`);
      if(changes.length) diffs[key] = "🔄 " + changes.join(", ");
    });
    let removed = [];
    if(prevSnap){
      const curKeys = new Set(rows.map(matchKey));
      removed = Object.keys(prevSnap).filter(k=>!curKeys.has(k));
    }
    return { diffs, removed };
  }

  function buildOutputCard(){
    const card = el('div', {class:'card'});
    const head = el('div',{class:'row'});
    head.appendChild(el('h2',{style:'margin:0'},["📋 작성상황 리스트업 결과"]));
    const genBtn = el('button',null,["▶ 작성상황 생성 (변경사항 확인)"]);
    const csvBtn = el('button',{class:'ghost'},["CSV 내보내기"]);
    const xlsxBtn = el('button',{class:'ghost'},["엑셀 내보내기"]);
    head.appendChild(genBtn); head.appendChild(csvBtn); head.appendChild(xlsxBtn);
    card.appendChild(head);
    if(ledgerTemplate.length){
      card.appendChild(el('div',{class:'hint'},[`내보내기는 붙여넣어 두신 작성상황 대장 서식(컬럼 ${ledgerTemplate.length}개)을 그대로 따릅니다.`]));
    }
    card.appendChild(el('div',{class:'hint'},["※ '작성상황 생성'을 누를 때마다 직전에 생성했던 내용과 비교해서 바뀐 부분(시작일/완료일/BPR/로그북/작업조)을 표시해드립니다."]));
    const wrap = el('div',{id:'resultWrap', style:'margin-top:10px; overflow-x:auto;'});
    card.appendChild(wrap);
    let cache = [];
    async function gen(){
      cache = computeRules();
      const prevSnap = await loadSnapshot();
      const { diffs, removed } = diffAgainst(cache, prevSnap);
      renderResult(wrap, cache, diffs, removed, prevSnap);
      await saveSnapshot(cache);
    }
    genBtn.onclick = gen;
    csvBtn.onclick = ()=> exportCSV(cache.length?cache:computeRules());
    xlsxBtn.onclick = ()=> exportXLSX(cache.length?cache:computeRules());
    return card;
  }

  function fmtOrTBD(d){ return d? iso(d) : "확인필요"; }

  function renderResult(wrap, rows, diffs, removed, prevSnap){
    wrap.innerHTML = "";
    diffs = diffs || {}; removed = removed || [];
    if(rows.length===0){ wrap.appendChild(el('div',{class:'hint'},["표시할 배치가 없습니다."])); return; }
    if(removed.length){
      wrap.appendChild(el('div', {class:'errbox'}, [`⚠️ 직전 확인 때는 있었지만 이번엔 목록에 없는 배치: ${removed.join(', ')} (일정이 취소되었거나 붙여넣기에서 빠졌을 수 있습니다)`]));
    }
    const table = el('table', {class:'tbl'});

    if(ledgerTemplate.length){
      wrap.appendChild(el('div', {class:'hint', style:'margin-bottom:6px;'}, ["붙여넣어 두신 작성상황 대장과 동일한 컬럼 구성입니다. 회색 컬럼은 매칭되지 않아 빈칸으로 유지됩니다. 맨 오른쪽 '변경사항'은 화면 확인용이며 내보내기에는 포함되지 않습니다."]));
      const head = el('tr');
      ledgerTemplate.forEach(h=> head.appendChild(el('th', {style: h.field? '':'background:#5b6b7c;'}, [h.text])));
      head.appendChild(el('th', {style:'background:#a1560a;'}, ["변경사항"]));
      table.appendChild(el('thead',null,[head]));
      const body = el('tbody');
      state.ledgerRows.forEach(r=>{
        const tr = el('tr', {style:'opacity:0.6;'});
        r.forEach(v=> tr.appendChild(el('td',null,[String(v)])));
        tr.appendChild(el('td'));
        body.appendChild(tr);
      });
      rows.forEach((b,i)=>{
        const d = diffs[matchKey(b)];
        const tr = el('tr', {class: (b.note?'flag':'') + (d?' flag':'') + (selectedResultId===b.id?' selected-row':'')});
        tr.style.cursor = 'pointer';
        tr.onclick = ()=>{ selectedResultId = (selectedResultId===b.id)? null : b.id; renderResult(wrap, rows, diffs, removed, prevSnap); };
        ledgerTemplate.forEach(h=>{
          const v = h.field? (fieldValueFor(b,h.field,i) || '-') : "-";
          tr.appendChild(el('td', {style: h.field? '':'background:#f2f4f7; color:var(--sub);'}, [String(v)]));
        });
        tr.appendChild(el('td', {class:'note'}, [d||'-']));
        body.appendChild(tr);
      });
      table.appendChild(body);
      wrap.appendChild(table);
      return;
    }

    wrap.appendChild(el('div', {class:'hint', style:'margin-bottom:6px;'}, ["③번 칸에 기존에 쓰시던 작성상황 대장을 붙여넣으면, 그 서식 그대로 아래에 표시됩니다. (지금은 기본 표시 형식입니다)"]));
    const head = el('tr');
    ["No.","품목명","제법+년도","해당월","순번","시작일","완료일","중간체구분","PV","BPR제출예정일","로그북제출예정일","작업조","작업조명","비고","변경사항"].forEach(h=>head.appendChild(el('th',null,[h])));
    table.appendChild(el('thead',null,[head]));
    const body = el('tbody');
    rows.forEach((b,i)=>{
      const d = diffs[matchKey(b)];
      const tr = el('tr', {class: ((b.note||d)?'flag':'') + (selectedResultId===b.id?' selected-row':'')});
      tr.style.cursor = 'pointer';
      tr.onclick = ()=>{ selectedResultId = (selectedResultId===b.id)? null : b.id; renderResult(wrap, rows, diffs, removed, prevSnap); };
      [i+1, b.codeId, `${b.method}${b.year}`, b.monthCode, b.seq, iso(b.start), iso(b.end), b.qcType, b.pv?'O':'-', fmtOrTBD(b.bpr), iso(b.logbook), b.team, b.rosterName||'-', b.note||'-', d||'-']
        .forEach(v=> tr.appendChild(el('td',null,[String(v)])));
      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
  }

  function fieldValueFor(b, field, idx){
    switch(field){
      case 'no': return idx+1;
      case 'item': return b.codeId;
      case 'methodYear': return `${b.method}${b.year}`;
      case 'method': return b.method;
      case 'year': return b.year;
      case 'monthCode': return b.monthCode;
      case 'seq': return b.seq;
      case 'start': return iso(b.start);
      case 'end': return iso(b.end);
      case 'qcType': return b.qcType;
      case 'pv': return b.pv? 'O':'-';
      case 'cv': return b.cv ? 'O' : '-';
      case 'realtime': return b.realtime? 'O':'-';
      case 'bpr': return b.bpr? iso(b.bpr):'확인필요';
      case 'logbook': return iso(b.logbook);
      case 'floor2': return b.floor2 ? iso(nthBizDayFrom(b.start, 2)) : '';
      case 'team': return b.team;
      case 'writer1': return b.rosterName1||'';
      case 'confirmer1': return b.rosterName2||'';
      case 'writer2': return '';
      case 'confirmer2': return '';
      case 'note': return b.note||'';
      default: return '';
    }
  }

  function toRows(batches){
    if(ledgerTemplate.length){
      const header = ledgerTemplate.map(h=>h.text);
      const newRows = batches.map((b,i)=> ledgerTemplate.map(h=> h.field? (fieldValueFor(b,h.field,i) || '-') : "-"));
      return [header, ...state.ledgerRows, ...newRows];
    }
    const header = ["No.","품목명","제법+년도","해당월","순번","시작일","완료일","품질시험진행중간체","PV여부확인","CV여부확인","실시간품목","BPR제출예정일","로그북제출예정일","작업조","작업조명","비고"];
    return [header, ...batches.map((b,i)=>[
      i+1, b.codeId, `${b.method}${b.year}`, b.monthCode, b.seq, iso(b.start), iso(b.end),
      b.qcType, b.pv?'O':'-', b.cv?'O':'-', b.realtime?'O':'-',
      b.bpr?iso(b.bpr):'확인필요', iso(b.logbook), b.team, b.rosterName||'', b.note||''
    ])];
  }
  function exportCSV(batches){
    const rows = toRows(batches);
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download = `작성상황_${state.year}-${String(state.month).padStart(2,'0')}.csv`; a.click();
  }
  function exportXLSX(batches){
    const rows = toRows(batches);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "작성상황");
    XLSX.writeFile(wb, `작성상황_${state.year}-${String(state.month).padStart(2,'0')}.xlsx`);
  }

  loadLedgerTemplate().then(loadMonth);
})();
</script>
